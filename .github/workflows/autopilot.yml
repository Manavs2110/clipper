name: Autopilot

on:
  schedule:
    - cron: "17 */2 * * *"   # every 2 hours (GitHub may start it a few minutes late)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Process a clip but don't post anything"
        type: boolean
        default: false

concurrency:
  group: autopilot
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: System packages
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg fonts-dejavu-core libgl1

      - name: Cache Whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-v1

      - name: Install
        run: pip install -q -r requirements.txt

      - name: Post one clean clip
        run: python -m clipper.auto ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          META_TOKENS_JSON: ${{ secrets.META_TOKENS_JSON }}
          YOUTUBE_TOKENS_JSON: ${{ secrets.YOUTUBE_TOKENS_JSON }}
          YOUTUBE_EVERY_HOURS: "4"
          ALLOW_BLURRED_NUDITY: "false"
          FONT_PATH: /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf
